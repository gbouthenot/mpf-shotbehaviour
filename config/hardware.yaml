#config_version=6

########################
# In this file:
# - hardware declaration
# - Virtual Platform initial state
# - switches
# - coils
# - lights
########################
---

hardware:
  platform: p3_roc
p_roc:
  driverboards: pdb

###
# Virtual Platform initial state
###
virtual_platform_start_active_switches:
  - s_trough1


############
# Switches #
############
switches:
  s_trough1:
    number: direct-14
  s_left_flipper:
    number: direct-63
    tags: left_flipper
  s_right_flipper:
    number: direct-60
    tags: right_flipper
  s_plunger:
    number: direct-15
  s_start_button:
    number: direct-62
    tags: start
  s_triangle1:
    number: direct-21
  s_triangle2:
    number: direct-22
  s_triangle3:
    number: direct-23
  s_triangle4:
    number: direct-24
  s_triangle5:
    number: direct-25
  s_triangle6:
    number: direct-26
  s_triangle7:
    number: direct-27


#########
# Coils #
#########
coils:
  c_flipper_left:
